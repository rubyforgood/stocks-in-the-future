---
en:
  activemodel:
    errors:
      models:
        cash_adjustment:
          attributes:
            amount:
              greater_than_zero: must be more than zero
              invalid: must be an amount in dollars, like 12.50
            portfolio:
              blank: must exist before money can move
            reason:
              inclusion: must be one of the listed reasons
            transaction_type:
              inclusion: must be a deposit or a debit
  activerecord:
    attributes:
      portfolio_transaction:
        reasons:
          administrative_adjustments: Administrative adjustment
          attendance_earnings: Earnings from attendance
          awards: Award
          grade_earnings: Earnings from grades
          math_earnings: Earnings from math
          reading_earnings: Earnings from reading
          transaction_fees: Transaction fees
      user:
        type: Role
    errors:
      models:
        school_year:
          attributes:
            year_id:
              taken: is already added to this school
        stock:
          attributes:
            company_website:
              invalid: must be a valid HTTP or HTTPS URL
  admin:
    announcements:
      create:
        notice: Announcement created successfully.
      destroy:
        notice: Announcement deleted successfully.
      update:
        notice: Announcement updated successfully.
    classrooms:
      create:
        notice: Classroom created successfully.
      destroy:
        notice: Classroom deleted successfully.
      update:
        notice: Classroom updated successfully.
    grades:
      create:
        notice: Grade created successfully.
      destroy:
        notice: Grade deleted successfully.
      update:
        notice: Grade updated successfully.
    portfolio_transactions:
      create:
        notice: Portfolio transaction created successfully.
      destroy:
        notice: Portfolio transaction deleted successfully.
      update:
        notice: Portfolio transaction updated successfully.
    school_years:
      create:
        notice: School year created successfully.
      destroy:
        delete_restricted: Cannot delete school year because it has associated records.
          Please remove all classrooms and quarters first.
        notice: School year deleted successfully.
      update:
        notice: School year updated successfully.
    schools:
      create:
        notice: School created successfully.
      destroy:
        notice: School deleted successfully.
      school_years:
        create:
          notice:
            one: "%{year} added, with 1 quarter."
            other: "%{year} added, with %{count} quarters."
        destroy:
          has_classrooms:
            one: "%{year} still has 1 classroom, so it cannot be removed."
            other: "%{year} still has %{count} classrooms, so it cannot be removed."
          notice:
            one: "%{year} removed, along with its quarter."
            other: "%{year} removed, along with its %{count} quarters."
      update:
        notice: School updated successfully.
    stocks:
      create:
        notice: Stock created successfully.
      destroy:
        notice: Stock deleted successfully.
      update:
        notice: Stock updated successfully.
    students:
      add_transaction:
        notice: Transaction added successfully.
      create:
        notice: 'Student %{username} created successfully. Password: %{password}'
      destroy:
        notice: Student %{username} archived successfully.
      import:
        errors:
          no_file: Please select a CSV file
          no_students: No students found in CSV file
      restore:
        notice: Student %{username} restored successfully.
      update:
        notice: Student updated successfully.
    teachers:
      create:
        notice: Teacher created successfully. Password reset email has been sent.
      deactivations:
        create:
          notice: Teacher %{username} deactivated successfully.
      destroy:
        must_be_deactivated: Teacher must be deactivated before permanent deletion.
        notice: Teacher %{username} permanently deleted.
      reactivations:
        create:
          notice: Teacher %{username} reactivated successfully.
      update:
        notice: Teacher updated successfully.
    users:
      create:
        notice: User created successfully.
      destroy:
        notice: User deleted successfully.
      update:
        notice: User updated successfully.
    years:
      create:
        notice: Year created successfully.
      destroy:
        notice: Year deleted successfully.
      update:
        notice: Year updated successfully.
  announcements:
    create:
      notice: Announcement was successfully created.
    destroy:
      notice: Announcement was successfully destroyed.
    not_found: Announcement not found.
    update:
      notice: Announcement was successfully updated.
  application:
    access_denied:
      admin_required: Access denied. Admin privileges required.
      no_access: You do not have access to this page.
  classrooms:
    archived:
      alert: This classroom has been archived and is no longer accessible.
    create:
      notice: Classroom was successfully created.
    destroy:
      notice: Classroom was successfully destroyed.
    toggle_trading:
      alert: Unable to update trading status.
      disabled: Trading has been disabled for this classroom.
      enabled: Trading has been enabled for this classroom.
    update:
      notice: Classroom was successfully updated.
  fields:
    portfolio_path:
      index:
        portfolio: Portfolio
  grade_books:
    finalize:
      already_completed: Cannot finalize because it's already completed.
      incomplete: 'Cannot finalize: Some entries are incomplete.'
      notice: Grade book finalized. Funds have been distributed.
    populate:
      completed: This grade book is complete, so students cannot be added to it.
      none_added: Every student in this class already has a row.
      notice:
        one: Added 1 student to this grade book.
        other: Added %{count} students to this grade book.
    reopen:
      not_completed: That grade book is not finalized, so there is nothing to reopen.
      notice: Grade book reopened for corrections. The payment already made is unchanged.
    update:
      completed: This grade book is finalized. An admin can reopen it to make corrections.
      notice: Grades saved.
  helpers:
    label:
      portfolio_transaction:
        amount_cents: Amount
      student:
        portfolio_path: Portfolio link
  orders:
    cancel:
      confirm: |-
        Cancel this order?

        It will not be filled, and the cash it was holding goes back to your balance straight
        away. You can place it again whenever you like.
      pending_only: Only pending orders can be canceled
      success: Order was successfully canceled
      unauthorized: You can only cancel your own orders
    create:
      notice: Order was successfully created.
    destroy:
      notice: Order was successfully destroyed.
    update:
      notice: Order was successfully updated.
  profiles:
    password:
      success: Your password was changed.
    update:
      success: Your profile was updated.
  students:
    create:
      notice: 'Student %{username} created successfully. Initial password: %{password}'
    destroy:
      notice: Student %{username} deleted successfully.
    generate_password:
      notice: 'New password generated for %{username}: %{password}'
    not_found: Student not found
    reset_password:
      notice: 'Password reset for %{username}. New password: %{password}'
    update:
      notice: Student updated successfully.
  teachers:
    create:
      notice: Teacher created successfully. An account setup email has been sent.
